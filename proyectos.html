<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting | PhD Fanny Petermann-Rocha</title>
    <link rel="canonical" href="projects/">
    <script>
      const cleanTarget = "projects/";
      const localTarget = "projects/index.html";
      const target = (window.location.protocol === "file:" ? localTarget : cleanTarget)
        + window.location.search + window.location.hash;
      window.location.replace(target);
      document.addEventListener("DOMContentLoaded", () => {
        document.querySelector("a").setAttribute("href", target);
      });
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=projects/index.html"></noscript>
  </head>
  <body>
    <p>Redirecting to <a href="projects/index.html">Projects</a>.</p>
  </body>
</html>
