<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting | PhD Fanny Petermann-Rocha</title>
    <link rel="canonical" href="contact/">
    <script>
      const cleanTarget = "contact/";
      const localTarget = "contact/index.html";
      const target = (window.location.protocol === "file:" ? localTarget : cleanTarget)
        + window.location.search + window.location.hash;
      window.location.replace(target);
      document.addEventListener("DOMContentLoaded", () => {
        document.querySelector("a").setAttribute("href", target);
      });
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=contact/index.html"></noscript>
    <link rel="icon" type="image/png" sizes="32x32" href="Imagenes/imagenes/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="Imagenes/imagenes/favicon/favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="192x192" href="Imagenes/imagenes/favicon/favicon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="Imagenes/imagenes/favicon/favicon-512x512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="Imagenes/imagenes/favicon/apple-touch-icon.png">
    <meta name="theme-color" content="#A92B32">
  </head>
  <body>
    <p>Redirecting to <a href="contact/index.html">Contact</a>.</p>
  </body>
</html>
